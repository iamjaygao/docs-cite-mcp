name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor the README promises (the MCP SDK's own minimum)
        python-version: ["3.10", "3.11", "3.12"]
    env:
      DOCS_CITE_MODEL_DIR: ${{ github.workspace }}/.models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Before anything is installed: the Markdown path is stdlib-only, and
      # PDF / Word / dense must degrade to "skipped", not break the index.
      - name: Index invariants, stdlib only
        run: python test_index.py

      - name: Install MCP SDK, pypdf, python-docx, fastembed
        run: pip install -r requirements.txt

      # the embedding model is ~70 MB; download it once, not on every run
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .models
          key: embed-BAAI-bge-small-en-v1.5-v1

      - name: Index invariants, all formats and hybrid retrieval
        run: python test_index.py

      # Lexical floors sit just under the current sample-corpus scores (recall
      # 0.90, ndcg 0.863, mrr 0.85 at k=3, 10 queries over Markdown, PDF, Word),
      # so losing a single query fails the build.
      - name: Retrieval quality gate, lexical
        run: >
          python eval_search.py --docs ./sample-docs --gold gold.example.jsonl --k 3
          --mode lexical --min-recall 0.85 --min-ndcg 0.80 --min-mrr 0.80

      # Hybrid scores 1.00 / 0.963 / 0.95. The floors leave room for one rank to
      # flip under a different ONNX build, but fail if hybrid falls to lexical's level.
      - name: Retrieval quality gate, hybrid
        run: >
          python eval_search.py --docs ./sample-docs --gold gold.example.jsonl --k 3
          --mode hybrid --min-recall 0.90 --min-ndcg 0.88 --min-mrr 0.88

      - name: Tool contract, through an in-process MCP client
        run: python test_server.py

      - name: Example over the stdio transport (Markdown, PDF, Word; hybrid)
        run: |
          python examples/cite_and_verify.py "what is the BM25 baseline NDCG"
          python examples/cite_and_verify.py "how far did median latency fall"
          python examples/cite_and_verify.py "how do I undo a deployment"
