name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor the README promises (the MCP SDK's own minimum)
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Before anything is installed: the Markdown path is stdlib-only, and
      # PDF / Word must degrade to "skipped", not break the index.
      - name: Index invariants, stdlib only
        run: python test_index.py

      - name: Install MCP SDK, pypdf, python-docx
        run: pip install -r requirements.txt

      - name: Index invariants, all formats
        run: python test_index.py

      # Floors sit just under the current sample-corpus scores (recall 0.90,
      # ndcg 0.863, mrr 0.85 at k=3 over 10 queries in Markdown, PDF and Word),
      # so losing a single query fails the build.
      - name: Retrieval quality gate
        run: >
          python eval_search.py --docs ./sample-docs --gold gold.example.jsonl --k 3
          --min-recall 0.85 --min-ndcg 0.80 --min-mrr 0.80

      - name: Tool contract, through an in-process MCP client
        run: python test_server.py

      - name: Example over the stdio transport (Markdown, PDF, Word)
        run: |
          python examples/cite_and_verify.py "what is the BM25 baseline NDCG"
          python examples/cite_and_verify.py "how far did median latency fall"
          python examples/cite_and_verify.py "how do I roll back a release"
