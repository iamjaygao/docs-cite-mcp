name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor the README promises (the MCP SDK's own minimum)
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # docs_index.py, eval_search.py and test_index.py are stdlib-only,
      # so these two steps run before anything is installed.
      - name: Index and citation invariants
        run: python test_index.py

      # Floors sit just under the current sample-corpus scores (recall 0.857,
      # ndcg 0.804, mrr 0.786 at k=3), so losing a single query fails the build.
      - name: Retrieval quality gate
        run: >
          python eval_search.py --docs ./sample-docs --gold gold.example.jsonl --k 3
          --min-recall 0.85 --min-ndcg 0.75 --min-mrr 0.75

      - name: Install MCP SDK
        run: pip install "mcp>=2,<3"

      - name: Tool contract, through an in-process MCP client
        run: python test_server.py

      - name: Example over the stdio transport
        run: python examples/cite_and_verify.py "what is the BM25 baseline NDCG"
